name: refresh-gold-valuation

on:
  schedule:
    # Monthly, a few days after the Fed H.6 M2 release lands
    - cron: '0 7 5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python gold_valuation_fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold/valuation.json
          git diff --staged --quiet || git commit -m "refresh gold valuation snapshot"
          git push
